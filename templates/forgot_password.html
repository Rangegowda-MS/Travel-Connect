{% extends 'index.html' %}
{% block content %}
<div class="v">
    <div class="container"><br><br>
        <h1 class="pt">FORGOT PASSWORD</h1><br><br>
        <div class="row">
            <div class="col-md-3"></div>
            <div class="form col-md-6 p-4 shadow-lg bg-light">
                <form method="POST" class="form-group">
                    {% csrf_token %}

                    <!-- Username -->
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" required>
                    <br>

                    <!-- New Password -->
                    <label for="id_new_password">New Password</label>
                    <div class="input-group">
                        <input type="password" name="new_password" id="id_new_password" class="form-control" required>
                        <span class="input-group-text" onclick="togglePassword('id_new_password')" style="cursor: pointer;">👁️</span>
                    </div>
                    <br>

                    <!-- Confirm Password -->
                    <label for="id_confirm_password">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" name="confirm_password" id="id_confirm_password" class="form-control" required>
                        <span class="input-group-text" onclick="togglePassword('id_confirm_password')" style="cursor: pointer;">👁️</span>
                    </div>
                    <br>

                    <button type="submit" class="btn btn-primary">RESET PASSWORD</button>
                </form>

                {% if messages %}
                    <br>
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            </div>
            <div class="col-md-3"></div>
        </div>
    </div>
    <br><br><br>
</div>

<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        field.type = field.type === "password" ? "text" : "password";
    }
</script>

<style>
    .btn {
        display: block;
        margin: 0 auto;
    }

    .pt {
        font-family: 'Viga';
        text-align: center;
    }

    .v {
        background: linear-gradient(to right, #ffd3b6, #a8e6cf, #dcedc1);
        height: 100vh;
    }
</style>
{% endblock %}
